<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BISHOP — DORM LOG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  :root {
    --green:#4aff91; --dim-green:#1a3a2a; --red:#cc1111;
    --dark:#050805; --text:#a0ffb8; --muted:#3a6a4a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--dark);color:var(--text);
    font-family:'Share Tech Mono',monospace;
    height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    overflow:hidden;user-select:none;
    transition:background 5s ease;
  }

  /* Blood veins */
  .veins{
    position:fixed;inset:0;
    pointer-events:none;z-index:106;
    opacity:0;transition:opacity 3s ease;
    background:
      radial-gradient(ellipse at 0% 0%,rgba(120,0,0,0.4) 0%,transparent 45%),
      radial-gradient(ellipse at 100% 0%,rgba(100,0,0,0.3) 0%,transparent 40%),
      radial-gradient(ellipse at 0% 100%,rgba(100,0,0,0.3) 0%,transparent 40%),
      radial-gradient(ellipse at 100% 100%,rgba(120,0,0,0.35) 0%,transparent 45%);
  }
  .vein-svg{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:106;
    opacity:0;transition:opacity 3s ease;
  }
  .scanlines{
    position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,rgba(0,0,0,0.28) 2px,rgba(0,0,0,0.28) 4px);
    pointer-events:none;z-index:200;
  }
  .vignette{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.96) 100%);
    pointer-events:none;z-index:199;
  }
  .glitch-bar{position:fixed;left:0;right:0;height:3px;background:rgba(74,255,145,0.12);pointer-events:none;z-index:201;opacity:0;}
  .signal-loss{
    position:fixed;inset:0;background:rgba(0,6,3,0.94);
    pointer-events:none;z-index:203;opacity:0;
    display:flex;align-items:center;justify-content:center;
    font-size:0.65rem;letter-spacing:0.5em;color:var(--muted);
  }

  /* ── HEARTBEAT BG PULSE ── */
  @keyframes hbPulse{
    0%,100%{background-color:var(--dark);}
    8%{background-color:rgb(14,2,2);}
    16%{background-color:var(--dark);}
    24%{background-color:rgb(10,1,1);}
    36%{background-color:var(--dark);}
  }
  body.heartbeat-active{
    animation:hbPulse 1.05s ease-in-out infinite;
  }

  /* HUD */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:205;}
  .hud-tl{position:absolute;top:20px;left:24px;font-size:0.58rem;color:var(--muted);letter-spacing:0.2em;line-height:1.9;}
  .hud-tr{position:absolute;top:20px;right:24px;font-size:0.58rem;color:var(--muted);letter-spacing:0.2em;text-align:right;line-height:1.9;}
  .hud-bl{position:absolute;bottom:20px;left:24px;font-size:0.55rem;color:var(--muted);letter-spacing:0.2em;}
  .hud-br{position:absolute;bottom:20px;right:24px;font-size:0.55rem;color:var(--muted);letter-spacing:0.2em;}
  .rec-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:middle;animation:recBlink 1.1s step-end infinite;}
  @keyframes recBlink{0%,100%{opacity:1}50%{opacity:0}}
  .corner{position:absolute;width:16px;height:16px;border-color:var(--muted);border-style:solid;opacity:0.4;}
  .corner.tl{top:12px;left:12px;border-width:1px 0 0 1px;}
  .corner.tr{top:12px;right:12px;border-width:1px 1px 0 0;}
  .corner.bl{bottom:12px;left:12px;border-width:0 0 1px 1px;}
  .corner.br{bottom:12px;right:12px;border-width:0 1px 1px 0;}
  /* Scene */
  .scene{width:100%;max-width:680px;padding:0 50px;display:flex;flex-direction:column;min-height:110px;justify-content:center;align-items:center;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;}
  /* Speech */
  .subtitle-box{background:transparent;border-left:2px solid rgba(120,30,30,0.6);padding:14px 18px;}
  .subtitle-text{font-size:clamp(0.85rem,2vw,1.05rem);color:var(--text);line-height:1.85;min-height:1.85em;text-shadow:0 0 8px rgba(74,255,145,0.35);}
  .subtitle-text .glitch-word{
    display:inline-block;
    position:relative;
    color:#ff4444;
    text-shadow:0 0 6px rgba(255,50,50,0.6);
    animation:wGlitch 0.6s steps(1) infinite;
  }
  .subtitle-text .glitch-word::before,
  .subtitle-text .glitch-word::after {
    content: attr(data-text);
    position:absolute;
    top:0;left:0;
    width:100%;
    overflow:hidden;
    background:transparent;
  }
  .subtitle-text .glitch-word::before {
    color:#0ff;
    text-shadow:-1px 0 rgba(0,255,255,0.5);
    animation:wGlitchB 0.6s steps(1) infinite;
    clip-path:inset(0 0 60% 0);
  }
  .subtitle-text .glitch-word::after {
    color:#f0f;
    text-shadow:1px 0 rgba(255,0,255,0.5);
    animation:wGlitchA 0.6s steps(1) infinite;
    clip-path:inset(60% 0 0 0);
  }
  @keyframes wGlitch{
    0%,100%{transform:translate(0,0);filter:none;opacity:1;}
    15%{transform:translate(-2px,0);filter:brightness(1.4);}
    20%{transform:translate(2px,0);filter:none;}
    70%{transform:translate(-2px,1px) skewX(-3deg);filter:brightness(1.6);}
    75%{transform:translate(0,0);filter:none;}
  }
  @keyframes wGlitchB{
    0%,100%{transform:translate(0,0);clip-path:inset(0 0 65% 0);}
    15%{transform:translate(-3px,0);clip-path:inset(15% 0 45% 0);}
    40%{transform:translate(2px,0);clip-path:inset(0 0 70% 0);}
    70%{transform:translate(-2px,0);clip-path:inset(10% 0 55% 0);}
  }
  @keyframes wGlitchA{
    0%,100%{transform:translate(0,0);clip-path:inset(65% 0 0 0);}
    20%{transform:translate(3px,0);clip-path:inset(70% 0 0 0);}
    50%{transform:translate(-2px,0);clip-path:inset(55% 0 0 0);}
    80%{transform:translate(2px,0);clip-path:inset(75% 0 0 0);}
  }
  .redacted{display:inline-block;background:var(--text);color:var(--text);border-radius:1px;padding:0 3px;}
  .speaker-tag{font-size:0.55rem;color:var(--muted);letter-spacing:0.4em;text-transform:uppercase;margin-bottom:5px;}
  /* Stage */
  .stage-box{font-size:0.72rem;color:rgba(160,120,120,0.75);font-style:italic;padding:8px 0 8px 14px;border-left:1px solid rgba(100,20,20,0.5);}

  /* Silence */
  .silence-box{text-align:center;font-size:0.6rem;color:var(--muted);letter-spacing:0.8em;text-transform:uppercase;opacity:0;transition:opacity 1.5s;}
  .silence-box.show{opacity:1;}
  /* Final */
  .final-box{text-align:center;font-size:clamp(1.2rem,4vw,2rem);color:#ff2222;letter-spacing:0.3em;text-shadow:0 0 30px rgba(255,30,30,0.9);opacity:0;transition:opacity 1.5s;animation:fGlitch 2s steps(1) infinite;}
  .final-box.show{opacity:1;}
  @keyframes fGlitch{0%,88%,100%{opacity:1;transform:translate(0,0);filter:none}89%{opacity:0.2;transform:translate(-3px,0);filter:hue-rotate(90deg)}90%{opacity:1;transform:translate(2px,0)}93%{opacity:0.1;filter:brightness(3)}94%{opacity:1}}
  .final-sub{font-size:0.55rem;color:var(--muted);letter-spacing:0.35em;text-align:center;margin-top:10px;opacity:0;animation:fIn 2s ease 1.2s forwards;}
  /* Progress */
  .progress{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:300;}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--dim-green);transition:background 0.4s;}
  .dot.done{background:var(--muted);}
  .dot.active{background:var(--green);box-shadow:0 0 5px var(--green);}
  /* Next */
  .next-btn{position:fixed;bottom:38px;right:50px;background:none;border:1px solid var(--dim-green);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;padding:9px 22px;cursor:pointer;transition:all 0.2s;z-index:300;}
  .next-btn:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(74,255,145,0.2);}
  .next-btn:disabled{opacity:0.15;pointer-events:none;}

  @keyframes fIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="veins" id="veins"></div>
<svg class="vein-svg" id="veinSvg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="rgba(139,0,0,0.5)" stroke-width="1.2" stroke-linecap="round">
    <path d="M0,0 Q80,40 60,120 Q100,80 160,200 Q120,160 80,280"/>
    <path d="M0,0 Q40,100 120,140 Q60,180 100,300"/>
    <path d="M60,120 Q90,170 70,240 Q100,200 130,280"/>
    <path d="M1000,0 Q920,50 940,130 Q900,90 840,210 Q880,170 920,290"/>
    <path d="M1000,0 Q960,110 880,150 Q940,190 900,310"/>
    <path d="M0,700 Q70,640 50,560 Q90,600 150,480 Q110,520 70,400"/>
    <path d="M1000,700 Q930,640 950,560 Q910,600 850,480 Q890,520 930,400"/>
  </g>
</svg>
<div class="glitch-bar" id="gbar1" style="top:30%"></div>
<div class="glitch-bar" id="gbar2" style="top:65%"></div>
<div class="signal-loss" id="sigLoss">SIGNAL INTERRUPTED</div>
<div class="hud">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="hud-tl">
    <div><span class="rec-dot"></span>REC</div>
    <div id="camTime">00:00:00</div>
    <div>CAM-04 / DORM B</div>
  </div>
  <div class="hud-tr">
    <div>BISHOP'S DORM</div>
    <div>2026-05-20</div>
    <div id="sigStr">SIG ████████ 98%</div>
  </div>
  <div class="hud-bl">AUDIO ONLY — VIDEO CORRUPTED</div>
  <div class="hud-br">CH.4 / SECURED</div>
</div>

<div class="scene"><div id="content" style="width:100%"></div></div>

<div class="progress" id="progress"></div>
<button class="next-btn" id="nextBtn" onclick="advance()">Next ›</button>

<script>
const actx=new(window.AudioContext||window.webkitAudioContext)();
let droneOn=false;
function startDrone(){
  if(droneOn)return;droneOn=true;
  const m=actx.createGain();m.gain.setValueAtTime(0,actx.currentTime);m.gain.linearRampToValueAtTime(0.055,actx.currentTime+5);m.connect(actx.destination);
  [55,82.4,110].forEach((f,i)=>{
    const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=f;
    const g=actx.createGain();g.gain.value=0.3/(i+1);o.connect(g);g.connect(m);o.start();
    const lfo=actx.createOscillator();lfo.frequency.value=0.07+i*0.03;
    const lg=actx.createGain();lg.gain.value=f*0.004;lfo.connect(lg);lg.connect(o.frequency);lfo.start();
  });
  const nb=actx.createBuffer(1,actx.sampleRate*3,actx.sampleRate);
  const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  function ln(){const s=actx.createBufferSource();s.buffer=nb;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=200;const g=actx.createGain();g.gain.value=0.035;s.connect(f);f.connect(g);g.connect(m);s.start();s.onended=ln;}ln();
  const rb=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
  const rd=rb.getChannelData(0);for(let i=0;i<rd.length;i++)rd[i]=Math.random()*2-1;
  const rm=actx.createGain();rm.gain.setValueAtTime(0,actx.currentTime);rm.gain.linearRampToValueAtTime(0.03,actx.currentTime+6);rm.connect(actx.destination);
  const rf=actx.createBiquadFilter();rf.type='bandpass';rf.frequency.value=3500;rf.Q.value=0.4;rf.connect(rm);
  function lr(){const s=actx.createBufferSource();s.buffer=rb;s.connect(rf);s.start();s.onended=lr;}lr();
}

function playSubBassThud(){
  const t=actx.currentTime;
  const osc=actx.createOscillator();
  const gain=actx.createGain();
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-6;
  comp.ratio.value=12;
  osc.connect(gain);
  gain.connect(comp);
  comp.connect(actx.destination);
  osc.type='sine';
  osc.frequency.setValueAtTime(55,t);
  osc.frequency.exponentialRampToValueAtTime(28,t+0.35);
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(0.92,t+0.012);
  gain.gain.exponentialRampToValueAtTime(0.001,t+0.55);
  osc.start(t);
  osc.stop(t+0.6);
}

let hbInterval=null;
function playLubDub(){
  function pulse(freq,when,dur,vol){
    const o=actx.createOscillator();
    const g=actx.createGain();
    const lp=actx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=180;
    o.connect(lp);lp.connect(g);g.connect(actx.destination);
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0,when);
    g.gain.linearRampToValueAtTime(vol,when+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,when+dur);
    o.start(when);o.stop(when+dur+0.05);
  }
  const now=actx.currentTime;
  pulse(52,now,0.09,0.28);
  pulse(44,now+0.13,0.11,0.18);
}
function startHeartbeat(){
  if(hbInterval)return;
  document.body.classList.add('heartbeat-active');
  playLubDub();
  hbInterval=setInterval(playLubDub,1030);
}

const BF=[220,246,261,293,329,349,392,440];
function cf(c){const code=c.toLowerCase().charCodeAt(0);return BF[code%BF.length]*(1+(code%3)*0.05);}
let sh=[];
function stopSpk(){sh.forEach(clearTimeout);sh=[];}

function playTypingBlip(c){
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.type='sine';o.frequency.value=cf(c||'a');
  g.gain.setValueAtTime(0.055,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.06);
  o.start();o.stop(actx.currentTime+0.06);
}

function stopAll(){stopSpk();}

function pulseBars(){
  ['gbar1','gbar2'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.style.top=(15+Math.random()*65)+'%';
    el.style.height=(1+Math.random()*6)+'px';
    setTimeout(()=>{el.style.opacity='0.5';setTimeout(()=>{el.style.opacity='0';},80+Math.random()*100);},i*55);
  });
}
function sigGlitch(ms){const e=document.getElementById('sigLoss');e.style.opacity='1';setTimeout(()=>e.style.opacity='0',ms||280);}
function degradeSig(pct){
  const e=document.getElementById('sigStr');
  const full=Math.min(8,Math.round(pct/12.5));
  e.textContent='SIG '+'█'.repeat(full)+'░'.repeat(8-full)+' '+pct+'%';
  e.style.color=pct<40?'var(--red)':pct<70?'#aaaa00':'var(--muted)';
}

let veinProg=0;
function advanceVeins(step){
  veinProg=Math.min(1,veinProg+step);
  document.getElementById('veins').style.opacity=veinProg*0.85;
  document.getElementById('veinSvg').style.opacity=veinProg*0.7;
  const bleed=Math.max(0,(veinProg-0.7)/0.3);
  const r=Math.round(bleed*22);
  document.body.style.background='rgb('+r+','+Math.round(r*0.04)+','+Math.round(r*0.04)+')';
}

const GW=['motherfucker','fuck me','hurts','here goes'];
function parseSegs(html){
  const segs=[];let i=0,buf='';
  while(i<html.length){
    if(html[i]==='<'){
      if(html.slice(i).startsWith('<span class="redacted">')){
        if(buf){segs.push({t:buf});buf='';}
        const closeTag='</span>';
        const closeIdx=html.indexOf(closeTag,i);
        const full=html.slice(i,closeIdx+closeTag.length);
        const inner=full.replace(/<[^>]+>/g,'');
        const open='<span class="redacted">';
        segs.push({redactedChars:inner.split(''),open});
        i=closeIdx+closeTag.length;
      } else {
        if(buf){segs.push({t:buf});buf='';}
        const end=html.indexOf('>',i)+1;
        const tn=html.slice(i+1).match(/^([a-zA-Z]+)/)?.[1];
        if(tn){
          const closeTag='</'+tn+'>';
          const closeIdx=html.indexOf(closeTag,end);
          if(closeIdx>=0){
            segs.push({h:html.slice(i,closeIdx+closeTag.length)});
            i=closeIdx+closeTag.length;
          } else {
            segs.push({h:html.slice(i,end)});
            i=end;
          }
        } else {
          buf+=html[i++];
        }
      }
    } else {buf+=html[i++];}
  }
  if(buf)segs.push({t:buf});
  return segs;
}
function wrapG(html){
  let out=html;
  GW.forEach(w=>{
    const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,(m)=>`<span class="glitch-word" data-text="${m}">${m}</span>`);
  });
  return out;
}
let twT=null;
function typeIt(el,html,spd,onDone){
  if(twT){clearTimeout(twT);twT=null;}
  el.innerHTML='';
  const segs=parseSegs(html);
  let si=0,ci=0,built='';
  function next(){
    if(si>=segs.length){if(onDone)onDone();return;}
    const seg=segs[si];
    if(seg.redactedChars!==undefined){
      if(ci<seg.redactedChars.length){
        const partial=seg.open+seg.redactedChars.slice(0,ci+1).join('')+'</span>';
        if(ci===0){built+=partial;}
        else{const lastOpen=built.lastIndexOf(seg.open);built=built.slice(0,lastOpen)+partial;}
        el.innerHTML=wrapG(built);
        playTypingBlip(seg.redactedChars[ci]);
        ci++;twT=setTimeout(next,spd*1.2);
      } else {si++;ci=0;next();}
    } else if(seg.h!==undefined){
      built+=seg.h;el.innerHTML=wrapG(built);si++;ci=0;twT=setTimeout(next,spd*2);
    } else {
      if(ci>=seg.t.length){si++;ci=0;next();return;}
      const ch=seg.t[ci];
      built+=ch;el.innerHTML=wrapG(built);
      if(/[a-zA-Z]/.test(ch)) playTypingBlip(ch);
      ci++;twT=setTimeout(next,spd);
    }
  }
  next();
}

let cs=0;
setInterval(()=>{
  cs++;
  const h=Math.floor(cs/3600),m=Math.floor((cs%3600)/60),s=cs%60;
  document.getElementById('camTime').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
},1000);
setInterval(()=>{if(Math.random()<0.28)pulseBars();if(Math.random()<0.07)sigGlitch(90);},1900);

const BEAT_WET_IMPACT = 12;
const BEAT_SQUISH     = 15;

const BEATS=[
  {type:'stage',html:"[ BISHOP'S DORM — 02:47 AM ]",sig:99,vein:0.01,fx:[]},
  {type:'speech',html:'...hh...',sig:98,vein:0.02,fx:[]},
  {type:'speech',html:"Can't sleep. It's moving again. Feels like something chewing through the back of my skull — slowly. It's not in a hurry, this little bugger...",sig:95,vein:0.04,fx:[]},
  {type:'speech',html:"But I'm not gonna let it reach my brain...",sig:92,vein:0.04,fx:['bars']},
  {type:'speech',html:'God... <span class="redacted">████████</span>. <span class="redacted">████████</span>. I\'m sorry. I know you\'d tell me not to do this. I know you\'d say there\'s another way. But it\'s too late for me to get a surgery and I\'ve been looking for another way for so long... and this thing takes something precious from me every time I hesitate.',sig:88,vein:0.07,fx:['bars']},
  {type:'speech',html:"So I'm done hesitating.",sig:84,vein:0.04,fx:[]},
  {type:'stage',html:'[ Sound of a drawer opening. Metal on metal. ]',sig:80,vein:0.04,fx:['bars']},
  {type:'speech',html:'Found the knife three weeks ago. Kept it under the mattress... Told myself it was a "last resort".',sig:76,vein:0.05,fx:['bars']},
  {type:'speech',html:'Funny how last resorts have a way of becoming the only resort...',sig:73,vein:0.04,fx:[]},
  {type:'speech',html:"My hands aren't shaking. Haha... I thought they would be.",sig:70,vein:0.04,fx:[]},
  {type:'speech',html:'Oh fuck me... here goes...',sig:65,vein:0.06,fx:['bars','glitch']},
  {type:'stage',html:'[ INAUDIBLE ]',sig:52,vein:0.1,fx:['bars','glitch','sig']},
  {type:'stage',html:'[ Wet impact. Sharp exhale. Something clatters. ]',sig:42,vein:0.08,fx:['bars','glitch']},
  {type:'stage',html:'[ A sound that is — not quite a scream. Not quite animal. Something that is pure hatred on the inside. ]',sig:28,vein:0.12,fx:['bars','glitch','sig']},
  {type:'speech',html:'This is for my family, you motherfucker.',sig:20,vein:0.08,fx:['bars','glitch']},
  {type:'stage',html:'[ SQUISH ]',sig:8,vein:0.15,fx:['bars','glitch','sig']},
  {type:'silence',html:'[ Silence. ]',sig:4,vein:0.04,fx:['sig']},
  {type:'speech',html:"...It's dead.",sig:3,vein:0.03,fx:[]},
  {type:'speech',html:'I got it— out.',sig:2,vein:0.03,fx:['bars']},
  {type:'stage',html:'[ A body collapsing. ]',sig:1,vein:0.05,fx:['bars','glitch','sig']},
  {type:'final'},
];

let current=0,busy=false;
const pg=document.getElementById('progress');
BEATS.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.id='dot-'+i;pg.appendChild(d);});
function updateDots(){BEATS.forEach((_,i)=>{const d=document.getElementById('dot-'+i);d.className='dot'+(i<current?' done':i===current?' active':'');});}

function renderBeat(idx,cb){
  const beat=BEATS[idx];
  const box=document.getElementById('content');
  box.innerHTML='';
  if(beat.sig!==undefined)degradeSig(beat.sig);
  if(beat.vein)advanceVeins(beat.vein);
  (beat.fx||[]).forEach((f,i)=>{setTimeout(()=>{
    if(f==='bars')pulseBars();
    if(f==='glitch')sigGlitch(160);
    if(f==='sig')sigGlitch(420);
  },i*100);});

  if(idx===BEAT_SQUISH){
    playSubBassThud();
  }
  if(idx===BEAT_WET_IMPACT){
    setTimeout(startHeartbeat, 600);
  }

  if(beat.type==='speech'){
    const wrap=document.createElement('div');wrap.className='subtitle-box';
    const tag=document.createElement('div');tag.className='speaker-tag';tag.textContent='BISHOP';
    const txt=document.createElement('div');txt.className='subtitle-text';
    wrap.appendChild(tag);wrap.appendChild(txt);box.appendChild(wrap);
    typeIt(txt,beat.html,42,cb);

  } else if(beat.type==='stage'){
    const wrap=document.createElement('div');wrap.className='stage-box';wrap.textContent=beat.html;
    box.appendChild(wrap);
    pulseBars();
    setTimeout(()=>{cb();},900);

  } else if(beat.type==='silence'){
    const el=document.createElement('div');el.className='silence-box';el.textContent=beat.html;
    box.appendChild(el);requestAnimationFrame(()=>{el.classList.add('show');setTimeout(cb,2800);});

  } else if(beat.type==='final'){
    const end=new Date('2026-05-23T23:59:59').getTime();
    const el=document.createElement('div');el.className='final-box';
    const sub=document.createElement('div');sub.className='final-sub';sub.textContent='days : hrs : min : sec';
    box.appendChild(el);box.appendChild(sub);
    function tick(){
      const diff=Math.max(0,end-Date.now());
      const dd=Math.floor(diff/86400000),hh=Math.floor((diff%86400000)/3600000),mm=Math.floor((diff%3600000)/60000),ss=Math.floor((diff%60000)/1000);
      el.textContent='[ '+dd+' : '+String(hh).padStart(2,'0')+' : '+String(mm).padStart(2,'0')+' : '+String(ss).padStart(2,'0')+' ]';
      el.classList.add('show');
    }
    tick();setInterval(tick,1000);
    document.getElementById('nextBtn').disabled=true;
    document.getElementById('nextBtn').textContent='— end —';
  }
}

function advance(){
  if(busy||current>=BEATS.length)return;
  if(actx.state==='suspended')actx.resume();
  if(!droneOn)startDrone();
  busy=true;
  document.getElementById('nextBtn').disabled=true;
  updateDots();
  renderBeat(current,()=>{current++;busy=false;if(current<BEATS.length)document.getElementById('nextBtn').disabled=false;updateDots();});
}

updateDots();
</script>
</body>
</html>
