<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSA Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
    --amber:#d9861a;
    --amber-dim:rgba(217,134,26,.35);
    --bg:#060300;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--amber);
    font-family:'Share Tech Mono', monospace;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

/* Scanlines */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,140,0,.03) 0px,
            rgba(255,140,0,.03) 1px,
            transparent 2px,
            transparent 4px
        );
    pointer-events:none;
}

/* Subtle glow */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center,
        rgba(255,140,0,.05),
        transparent 70%);
    pointer-events:none;
}

.terminal{
    width:min(900px,90vw);
    border:1px solid var(--amber-dim);
    padding:60px;
    position:relative;
    background:rgba(15,7,0,.25);
    box-shadow:
        0 0 20px rgba(255,140,0,.05),
        inset 0 0 20px rgba(255,140,0,.03);
}

.header{
    text-align:center;
    margin-bottom:50px;
}

.top-tag{
    display:inline-block;
    border:1px solid var(--amber-dim);
    padding:8px 18px;
    font-size:12px;
    letter-spacing:6px;
    margin-bottom:30px;
}

.date{
    font-size:13px;
    letter-spacing:4px;
    opacity:.7;
    margin-bottom:35px;
}

.title{
    font-size:48px;
    letter-spacing:10px;
    text-transform:uppercase;
    margin-bottom:18px;
    text-shadow:0 0 12px rgba(217,134,26,.3);
}

.subtitle{
    font-size:14px;
    letter-spacing:5px;
    opacity:.7;
}

.line{
    height:1px;
    background:var(--amber-dim);
    margin:45px 0;
}

.message{
    text-align:center;
    line-height:2.2;
}

.status{
    font-size:28px;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.description{
    font-size:18px;
    letter-spacing:2px;
    opacity:.9;
}

.footer{
    margin-top:45px;
    border:1px solid var(--amber-dim);
    padding:18px;
    text-align:center;
    font-size:14px;
    letter-spacing:4px;
}

.blink{
    animation:blink 1.2s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}
</style>
</head>
<body>

<div class="terminal">

    <div class="header">
        <div class="top-tag">
            △ VANTAGE SYSTEMS AUTHORITY △
        </div>

        <div class="date">
            SYSTEM STATUS REPORT
        </div>

        <div class="title">
            ACCESS TERMINATED
        </div>

        <div class="subtitle">
            HOST CONNECTION LOST
        </div>
    </div>

    <div class="line"></div>

    <div class="message">
        <div class="status">
            CONNECTION TO HOST HAS BEEN TERMINATED<span class="blink">_</span>
        </div>

        <div class="description">
            PLEASE CONTACT THE OWNER FOR WEBPAGE CONTENT.
        </div>
    </div>

    <div class="line"></div>

    <div class="footer">
        △ CLASSIFIED TERMINAL △
    </div>

</div>

</body>
</html>
